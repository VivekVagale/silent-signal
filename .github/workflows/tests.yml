name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Two tests check that web/js/detectors.js matches the Python networks.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # MediaPipe pulls in OpenCV, which needs libGL on the runner.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libgl1
      - run: pip install -r requirements.txt pytest-github-actions-annotate-failures
      # Downloads the MediaPipe landmark models once, then decodes the sample videos end to end.
      - run: python -m pytest -q -rs
